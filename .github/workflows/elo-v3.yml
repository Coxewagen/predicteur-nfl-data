name: Dashboard NFL signaux d'edge

on:
  schedule:
    - cron: '23 */6 * * *'     # toutes les 6 heures
  workflow_dispatch: {}        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: elo-v3
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elo-v3
    steps:
      - name: Récupère le dépôt
        uses: actions/checkout@v4

      - name: Installe Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache des données nflverse (saisons passées)
        uses: actions/cache@v4
        with:
          path: elo-v3/nfl_cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Installe les dépendances
        run: pip install -r requirements.txt

      - name: Lance le modèle et génère le dashboard
        run: python nfl_signaux.py

      - name: Publie le dashboard
        run: |
          git config user.name "predicteur-nfl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard_nfl.html
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -m "Mise à jour automatique des signaux d'edge NFL"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
