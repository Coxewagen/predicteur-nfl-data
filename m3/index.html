<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2818">
<title>M3 Prédicteur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Même identité que le Prédicteur NFL (page web) : terrain vert nuit en fond, blanc "craie" pour
   le texte, ambre pour les accents/CTA, bleu marine en structure — un seul thème fixe (comme la
   page web elle-même, qui n'a pas de variante claire), pas de bascule clair/sombre ici. */
:root{
  --pitch:#0d2818; --pitch2:#0a2013;
  --surface:rgba(255,255,255,.055); --surface-solid:#15331f;
  --ink:#f2f2f0; --muted:#c3d1ca; --line:rgba(255,255,255,.16); --track:rgba(255,255,255,.1);
  --navy:#1d3a6e; --on-navy:#ffffff; --navy-soft:#b7c6e4;
  --field:#3ddc84; --on-field:#04200f; --field-bg:rgba(61,220,132,.16);
  --bad:#ff6b60; --bad-bg:rgba(255,107,96,.16);
  --warn:#ffb020; --warn-bg:rgba(255,176,32,.16);
  --gold:#ffb020; --gold-bg:rgba(255,176,32,.16);
  --sans:"IBM Plex Sans",Arial,Helvetica,sans-serif; --cond:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--pitch),var(--pitch2));color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.45;margin:0}
svg.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.2em}

.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* --- barre du haut --- */
/* Pas de bandeau bleu plein : ça détonnait avec le vert terrain du reste de l'appli. Le titre
   reste sur le fond vert comme dans la page web d'origine (titre ambre, sous-titre craie), avec
   juste un fin trait de séparation en bas — le bleu marine redevient un simple accent (comme sur
   la page web), pas un bloc de couleur à lui tout seul. */
.topbar{background:transparent;color:var(--ink);display:flex;gap:12px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;border-bottom:1px solid var(--line)}
.topbar .ball{width:40px;height:40px;flex:none}
.topbar .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.eyebrow{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.topbar h1{font-family:var(--cond);font-size:24px;margin:0;font-weight:700;color:var(--gold)}
.refresh{background:rgba(255,255,255,0.1);border:1px solid var(--line);color:var(--ink);
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.refresh:active{background:rgba(255,255,255,0.28)}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.offline-banner{background:var(--warn-bg);color:var(--warn);display:flex;gap:8px;align-items:center;
  font-size:14px;padding:8px 16px;font-weight:600}

/* --- contenu --- */
main{flex:1;padding:16px;padding-bottom:28px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:14px}

h2{font-family:var(--cond);font-size:22px;margin:0;font-weight:700;display:flex;align-items:center;gap:9px}
h2 .sq{width:32px;height:32px;border-radius:9px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;flex:none}
h2 .sq.g{background:var(--field);color:var(--on-field)}
h2 .sq.gold{background:var(--gold);color:#241a02}
h2.week-head #weekTitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week-pager{margin-left:auto;display:flex;gap:6px;flex:none}
.pager-btn{width:30px;height:30px;border-radius:50%;background:var(--track);border:none;color:var(--ink);
  font-size:18px;line-height:1;display:grid;place-items:center;font-family:var(--sans)}
.pager-btn:disabled{opacity:.35}
.meta{color:var(--muted);font-size:16px;margin:0}
.alert{background:var(--warn-bg);border-left:6px solid var(--warn);border-radius:10px;padding:12px 14px;font-size:16px;display:flex;gap:10px}
.alert svg{color:var(--warn);margin-top:3px;flex:none}

.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* --- cartes de match --- */
.games{display:flex;flex-direction:column;gap:10px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;flex-direction:column;gap:9px}
.game.net{border-color:var(--field);box-shadow:inset 5px 0 0 var(--field)}
.ghead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.when{font-weight:600;color:var(--muted);font-size:16px;display:inline-flex;align-items:center;gap:6px}
.tag{font-family:var(--cond);font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;background:var(--track);color:var(--muted)}
.tag.net{background:var(--field);color:var(--on-field)}
.tag.ok{background:var(--field-bg);color:var(--field)} .tag.ko{background:var(--bad-bg);color:var(--bad)}
.team{display:flex;align-items:center;gap:10px}
.shield{width:36px;height:36px;flex:none}
.tname{font-size:17px;font-weight:500;min-width:0;flex:1;display:flex;align-items:center;gap:6px 7px;flex-wrap:wrap}
.tname.fav{font-weight:700}
.tname .short{display:none}
.role{color:var(--muted);display:inline-flex}
.chip{font-size:14px;font-weight:700;padding:1px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;background:var(--warn-bg);color:var(--warn)}
.chip.qb{background:var(--bad-bg);color:var(--bad)}
.pct{font-family:var(--cond);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct.fav{color:var(--field)}
.split{display:flex;height:11px;border-radius:999px;overflow:hidden;gap:3px;background:var(--surface);outline:1px solid var(--line)}
.split i{display:block;height:100%}
.gfoot{font-size:16px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.gfoot b{color:var(--ink);font-variant-numeric:tabular-nums}
.game.clickable{cursor:pointer}

/* --- verrou abonnement : remplace les probabilités quand non-abonné --- */
.lock-row{display:flex;align-items:center;gap:10px;background:var(--gold-bg);color:var(--gold);
  border-radius:9px;padding:8px 11px;font-size:14.5px;font-weight:600}
.lock-row svg{flex:none}
.lock-row .go{margin-left:auto;background:var(--gold);color:#241a02;border:none;border-radius:999px;
  font-size:13.5px;font-weight:700;padding:5px 12px;white-space:nowrap}
.blur-fig{filter:blur(6px);user-select:none;pointer-events:none}

/* --- bilan --- */
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.fig{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--navy);border-radius:12px;
  padding:11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig.g{border-top-color:var(--field)}
.fig .n{font-family:var(--cond);font-size:32px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.fig .l{font-size:13.5px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px;font-variant-numeric:tabular-nums}
th{font-family:var(--cond);text-align:left;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);border-bottom:2px solid var(--navy);padding:7px 8px 7px 0}
td{border-bottom:1px solid var(--line);padding:8px 8px 8px 0;vertical-align:top}
.yes{color:var(--field);font-weight:700} .no{color:var(--bad);font-weight:700}

/* --- carte "verrou" pleine largeur (bilan complet, détail des absences) --- */
.gate-card{background:var(--surface);border:1px dashed var(--gold);border-radius:12px;padding:18px 16px;
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gate-card svg.big{width:34px;height:34px;color:var(--gold)}
.gate-card b{font-size:16px}
.gate-card p{margin:0;color:var(--muted);font-size:14.5px}
.btn-gold{background:var(--gold);color:#241a02;border:none;border-radius:999px;font-weight:700;
  font-size:15.5px;padding:10px 20px;font-family:var(--sans)}

/* --- écran Abonnement --- */
.pro-hero{background:linear-gradient(160deg,var(--navy),#0a1f3d);color:#fff;border-radius:16px;
  padding:22px 18px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.pro-hero svg{width:40px;height:40px;color:var(--gold)}
.pro-hero h3{margin:2px 0 0;font-family:var(--cond);font-size:23px}
.pro-hero p{margin:0;color:var(--navy-soft);font-size:15px}
.pro-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.pro-list li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.pro-list svg{color:var(--field);flex:none;margin-top:2px}
.plan{background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:14px 16px;
  display:flex;flex-direction:column;gap:4px}
.plan .price{font-family:var(--cond);font-size:26px;font-weight:700}
.plan .sub{color:var(--muted);font-size:14px}
.btn-main{background:var(--gold);color:#241a02;border:none;border-radius:12px;font-weight:700;
  font-size:17px;padding:14px;font-family:var(--sans);width:100%}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}
.pro-active{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:20px 0}
.pro-active svg{width:46px;height:46px;color:var(--field)}
.legal{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.legal a{color:var(--muted)}

/* --- navigation par onglets --- */
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface-solid);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 8px;color:var(--muted);font-size:12.5px;font-family:var(--sans);font-weight:600}
.tab.active{color:var(--gold)}
.tab .ic{width:1.3em;height:1.3em}

/* --- modale fiche de match --- */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;
  align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-panel{position:relative;width:100%;max-width:760px;max-height:85vh;overflow-y:auto;
  background:linear-gradient(160deg,var(--surface-solid),var(--pitch2));border-radius:18px 18px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  box-shadow:0 -10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
.modal-panel .handle{width:40px;height:4px;border-radius:999px;background:var(--line);margin:0 auto}
.modal-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;
  background:var(--track);border:none;color:var(--ink);font-size:16px;line-height:1}

@media (max-width:380px){
  .tname .long{display:none} .tname .short{display:inline}
  .figs{gap:7px} .fig{padding:9px 7px} .fig .n{font-size:27px} .fig .l{font-size:12.5px}
}

/* --- case « J'ai parié » + badge « Validé » (mémorisés sur l'appareil) --- */
.gtags{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.validated{display:none;font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;align-items:center;gap:5px;background:var(--gold);color:#241a02}
.betted .validated{display:inline-flex}
.game.betted{border-color:var(--gold);box-shadow:inset 5px 0 0 var(--gold)}
.bet{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
  padding:6px 0;align-self:flex-start;min-height:44px}
.bet input{position:absolute;opacity:0;width:1px;height:1px}
.bet .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent}
.bet .box svg{width:18px;height:18px;stroke-width:3}
.bet input:checked + .box{background:var(--gold);border-color:var(--gold);color:#241a02}
.bet input:focus-visible + .box{outline:3px solid var(--gold);outline-offset:2px}

/* --- fiche détaillée --- */
.mwhen{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.dim{color:var(--muted);font-size:16px;font-weight:500;font-family:var(--sans)}
.verdict{margin:0;display:flex;gap:8px;align-items:flex-start;font-size:16px;font-weight:700}
.modal-panel h3{font-family:var(--cond);font-size:21px;margin:4px 0 0}
table.cmp{font-size:16px} table.cmp th:not(:first-child),table.cmp td:not(:first-child){text-align:center}
table.cmp td:first-child{color:var(--muted);font-size:16px}
.absgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.absgrid>div{min-width:0}
ul.abs{margin:4px 0 0;padding-left:18px} ul.abs li{margin:4px 0;font-size:16px}
@media (max-width:420px){.absgrid{grid-template-columns:1fr}}

/* --- pastilles de pourcentage (mêmes couleurs que le prédicteur : bleu = domicile, rouge = extérieur) --- */
.pright{display:flex;align-items:center;gap:10px;flex:none}
.pbadge{font-family:Consolas,"Courier New",monospace;font-weight:800;font-size:22px;color:#fff;border-radius:8px;
  padding:6px 11px;min-width:76px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.pbadge.home{background:#1d3a6e} .pbadge.away{background:#7a1f1f}
.pbadge.fav{box-shadow:0 0 0 3px var(--gold)}
.pbadge.big{font-size:34px;padding:10px 18px;min-width:118px}
.pbadge.big i{display:block;font-style:normal;font-family:var(--sans);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.9;margin-bottom:2px}
.bigbadges{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.pright .pct{min-width:2ch;text-align:right}
@media (max-width:460px){.pbadge{font-size:19px;min-width:64px;padding:5px 7px}.pright{gap:7px}.pbadge.big{font-size:30px;min-width:104px;padding:9px 14px}}

/* Un élément avec l'attribut hidden doit vraiment disparaître, même si sa classe lui donne un display (bandeau hors-ligne, etc.). */
[hidden]{display:none !important;}

.site-shell{max-width:760px;margin:0 auto;min-height:100%}

/* --- ajouts M3 : QB incertain, marché contraire, bloc marché --- */
.chip.qbq{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.tag.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.mkt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;font-size:16px}
.mkt.contra{border-color:var(--warn);box-shadow:inset 5px 0 0 var(--warn)}
.mkt .lead{margin:0;font-family:var(--cond);font-size:21px;font-weight:700}
.mkt p{margin:0}
.mkt b{font-variant-numeric:tabular-nums}
.mkt .warnline{color:var(--warn);font-weight:700;display:flex;gap:8px;align-items:flex-start}
.mkt .note{color:var(--muted);font-size:15px}
.filterbar{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.fbtn{background:var(--surface);color:var(--ink);border:2px solid var(--gold);border-radius:999px;font-family:var(--sans);
  font-weight:700;font-size:17px;padding:10px 18px;min-height:48px;display:inline-flex;gap:9px;align-items:center;cursor:pointer}
.fbtn.on{background:var(--gold);color:#241a02}
.fbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
#filterCount{color:var(--muted);font-size:16px;font-weight:600}
.betrow{display:flex;align-items:center;gap:4px 16px;flex-wrap:wrap;align-self:stretch}
.pickslot{display:inline-flex}
.pick{display:inline-flex;gap:8px;flex-wrap:wrap}
.pk{font:inherit;font-size:16px;font-weight:700;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.pk.on{background:var(--gold);border-color:var(--gold);color:#241a02}
.pk:focus-visible{outline:3px solid #fff;outline-offset:2px}
.recap{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.rh{font-family:var(--cond);font-size:24px;font-weight:700;margin:0}
.rnone{margin:0;color:var(--muted);font-size:17px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font:inherit;font-size:16px;font-weight:700;min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#241a02}
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:3px}
.rtop,.rsub{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rpick{font-family:var(--cond);font-size:21px}
.rcote{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.rsub{font-size:16px;color:var(--muted)}
.rst{font-weight:700;white-space:nowrap}
.rst.ok{color:var(--field)}
.rst.ko{color:var(--bad)}
.rst.live{color:var(--bad)}
.rcombo{background:var(--surface);border:2px solid var(--gold);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rcombo-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--cond);font-size:21px}
.rl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:18px}
.rl b{font-variant-numeric:tabular-nums}
.rl .okc,.okc{color:var(--field)}
.rl .koc,.koc{color:var(--bad)}
.rin{display:flex;gap:12px;flex-wrap:wrap}
.rin label{display:flex;flex-direction:column;gap:4px;font-size:16px;font-weight:600;color:var(--muted);flex:1 1 140px}
.rin input{font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-height:48px;width:100%;font-variant-numeric:tabular-nums}
.rin input:focus{outline:3px solid var(--gold);outline-offset:1px}
#rFigs{display:flex;flex-direction:column;gap:6px}
.rcote-in{font:inherit;font-size:21px;font-weight:700;color:var(--ink);background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:10px;padding:4px 10px;min-height:44px;width:96px;text-align:right;font-variant-numeric:tabular-nums}
.rcote-in.man{border-color:var(--gold)}
.rcote-in:focus{outline:3px solid var(--gold);outline-offset:1px}

.osrc{display:inline-flex;align-items:center;background:var(--surface);color:var(--ink);border:2px solid var(--gold);border-radius:8px;font-family:var(--sans);font-weight:700;font-size:17px;padding:6px 14px;min-height:38px;margin:0 0 12px}
.osrc[hidden]{display:none}
.osrc.bk{background:var(--gold);color:#241a02}

.osrcbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.osrc.ver{border-color:var(--line);background:transparent}
.osrc.tap{cursor:pointer}

h2.week-head #weekTitle{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15}
.legend .tag{font-size:13px;padding:2px 8px}
.legend{gap:8px 14px}
.updbar{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.ubtn{background:var(--gold);color:#241a02;border:2px solid var(--gold);border-radius:999px;font-family:var(--sans);
  font-weight:700;font-size:17px;padding:10px 18px;min-height:48px;display:inline-flex;gap:9px;align-items:center;cursor:pointer}
.ubtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ubtn[disabled]{opacity:.75;cursor:progress}
.ubtn.busy svg{animation:spin .8s linear infinite}
#updMsg{color:var(--muted);font-size:16px;font-weight:600}
#updMsg.ok{color:var(--field)}
#updMsg.err{color:var(--warn)}
#liveMsg{color:var(--muted);font-size:16px;font-weight:600;flex-basis:100%}
#liveMsg.on{color:var(--bad)}
.tag.live{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.tag.live .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:livepulse 1.2s ease-in-out infinite}
.ldot{display:none;width:12px;height:12px;border-radius:50%;background:var(--bad);flex:none}
.fbtn.has .ldot{display:inline-block;animation:livepulse 1.2s ease-in-out infinite}
.fbtn.on .ldot{background:#241a02}
.livemode .topbar,.livemode .week-head,.livemode #updatedMeta,.livemode .osrcbar,.livemode .recap,.livemode #updBtn,.livemode #updMsg{display:none}
.livemode main{padding:8px 8px 12px;gap:6px}
.livemode .view{gap:8px}
.livemode .updbar{gap:0}
.livemode #liveMsg{font-size:13px;flex-basis:auto;line-height:1.2}
.livemode .fbtn{font-size:14px;min-height:38px;padding:5px 12px}
.livemode #filterCount{font-size:13px}
.livemode .games{gap:6px}
.game.lrow{display:grid;grid-template-columns:54px 1fr auto 1fr;align-items:center;gap:4px;padding:6px 8px;border-radius:10px}
.lrow .lst{font-family:var(--cond);font-weight:700;font-size:13px;line-height:1.15;color:var(--bad);text-align:center;white-space:nowrap;display:flex;flex-direction:column;align-items:center}
.lrow .lst i{font-style:normal}
.lrow .lt{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;min-width:0}
.lrow .lt.a{justify-content:flex-end}
.lrow .shield{width:28px;height:28px;flex:none;border-radius:50%}
.lrow .lt.pick .shield{box-shadow:0 0 0 2px var(--gold)}
.lrow .pbadge{font-size:13px;padding:2px 4px;border-radius:6px;white-space:nowrap}
.lrow .pbadge.fav{box-shadow:0 0 0 2px var(--gold)}
.lrow .lsc{display:flex;align-items:baseline;justify-content:center;gap:4px;font-family:var(--cond);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px}
.lrow .lsc b{color:var(--muted)}
.lrow .lsc b.lead{color:var(--ink)}
.lrow .lsc i{font-style:normal;color:var(--muted);font-size:18px}
.game.lrow.betted{border-color:var(--gold)}
@keyframes livepulse{50%{opacity:.25}}
:root{color-scheme:dark}
</style>
</head>

    gamesEl.addEventListener("click", (e) => {
      if (e.target.closest(".betrow") || e.target.closest("[data-go-pro]")) return;
      const card = e.target.closest(".game");
      if (!card) return;
      const g = getGames()[+card.dataset.idx];
      if (g) open(g);
    });
  }
  function wirePanel(panelEl) {
    panelEl.addEventListener("change", (e) => {
      const i = e.target.closest("input[data-bet]");
      if (i) setBet(i.dataset.bet, i.checked);
    });
  }

  // src/site.js
  var $ = (id) => document.getElementById(id);
  var CTX = { isUnlocked: () => true, lockRow: () => "", gateCard: () => "" };
  var selectedWeek = null;
  var shown = [];
  function closeModal() {
    $("gameModalOverlay").classList.remove("open");
  }
  function openModal(g) {
    $("gameModalPanel").innerHTML = modalHtml(D, CTX, g);
    $("modalClose").addEventListener("click", closeModal);
    $("gameModalOverlay").classList.add("open");
  }
  var FILTER_KEY = "m3_filter_v1";
  var filterOn = false;
  try {
    filterOn = localStorage.getItem(FILTER_KEY) === "1";
  } catch (e) {
  }
  var isNet = (g) => !!g.pred && Math.max(g.pred.pHome, g.pred.pAway) >= D.safe;
  function render() {
    $("eyebrow").textContent = "Saison " + D.season + " \xB7 Semaine " + D.week;
    const ws = weekState(D, selectedWeek);
    selectedWeek = ws.w;
    const all = ws.games;
    shown = filterOn ? all.filter(isNet) : all;
    if (liveOnly) shown = shown.filter((g) => liveOv(g)._live === "in");
    $("filterBtn").setAttribute("aria-pressed", filterOn ? "true" : "false");
    $("filterBtn").classList.toggle("on", filterOn);
    const nLive = all.filter((g) => liveOv(g)._live === "in").length;
    $("liveBtn").setAttribute("aria-pressed", liveOnly ? "true" : "false");
    $("liveBtn").classList.toggle("on", liveOnly);
    $("liveBtn").classList.toggle("has", nLive > 0);
    document.body.classList.toggle("livemode", liveOnly);
    $("liveLbl").textContent = nLive ? "En direct \u00B7 " + nLive : "En direct";
    $("filterCount").textContent = (filterOn || liveOnly) ? shown.length + " match" + (shown.length > 1 ? "s" : "") + " sur " + all.length : "";
    $("weekTitle").textContent = ws.title;
    $("updatedMeta").textContent = "Mis \xE0 jour le " + D.updatedLabel + (ws.future ? " \xB7 pr\xE9visions provisoires" : "");
    $("weekPrev").disabled = selectedWeek <= ws.minWeek;
    $("weekNext").disabled = selectedWeek >= ws.maxWeek;
    $("games").innerHTML = shown.length ? shown.map((g, i) => gameCard(D, CTX, g, i)).join("") : '<p class="meta">' + (liveOnly ? "Aucun match en direct pour le moment." : filterOn ? (all.some((g) => g.pred) ? "Aucun favori \xE0 60 % ou plus cette semaine." : "Pas de pr\xE9vision M3 cette semaine : rien \xE0 filtrer.") : "Aucun match enregistr\xE9 pour cette semaine.") + "</p>";
    renderRecap();
  }
  $("weekPrev").addEventListener("click", () => {
    if (!$("weekPrev").disabled) {
      selectedWeek--;
      render();
    }
  });
  $("weekNext").addEventListener("click", () => {
    if (!$("weekNext").disabled) {
      selectedWeek++;
      render();
    }
  });
  $("filterBtn").addEventListener("click", () => {
    filterOn = !filterOn;
    try {
      localStorage.setItem(FILTER_KEY, filterOn ? "1" : "0");
    } catch (e) {
    }
    render();
  });
  wireGames($("games"), () => shown, openModal);
  wirePanel($("gameModalPanel"));
  $("gameModalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "gameModalOverlay") closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });
  // --- Bouton « Mettre à jour » (lien privé) : relit les dernières données publiées dans la base du lien ---
  var updBtn = $("updBtn"), updMsg = $("updMsg"), updBusy = false;
  function setMsg(t, cls) { updMsg.textContent = t; updMsg.className = cls || ""; }
  var FEED_URL = "https://raw.githubusercontent.com/Coxewagen/predicteur-nfl-data/main/m3/m3_data.json";
  var PAGE_URL = "https://raw.githubusercontent.com/Coxewagen/predicteur-nfl-data/main/m3/index.html";
  var APP_VERSION = "1.0.20";
  var newV = null;
  function vNum(v) { return String(v || "0").split(".").map((x) => parseInt(x, 10) || 0); }
  function vGt(a, b) {
    const x = vNum(a), y = vNum(b);
    for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
    return false;
  }
  // la page publiée la plus récente est chargée par-dessus (même nom de fichier, aucun cache) ; les paris et réglages restent (stockés dans le navigateur, même origine)
  async function loadNewPage(v) {
    const chip = $("appVer");
    if (window.top !== window) return;
    if (chip) chip.textContent = "v" + v + " …";
    try {
      const r = await fetch(PAGE_URL + "?t=" + Date.now(), { cache: "no-store" });
      const tok = "__ODDS" + "_KEY__";
      const h = (r.ok ? await r.text() : "").split(tok).join(ODDS_KEY);
      if (h.indexOf('var APP_VERSION = "' + v + '"') < 0 || h.indexOf("</html>") < 0) throw new Error("page");
      for (let i = setTimeout(function () {}, 0); i > 0; i--) {
        clearTimeout(i);
        clearInterval(i);
      }
      const f = document.createElement("iframe");
      f.id = "m3frame";
      f.srcdoc = h;
      f.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;border:0;background:#0d2818;z-index:2147483647";
      document.body.appendChild(f);
      document.documentElement.style.overflow = "hidden";
    } catch (e) {
      if (chip) chip.textContent = "v" + APP_VERSION + " \u2192 v" + v;
    }
  }
  function checkNewPage(v) {
    if (!v || !vGt(v, APP_VERSION)) return;
    newV = v;
    const chip = $("appVer");
    if (chip) {
      chip.textContent = "v" + APP_VERSION + " \u2192 v" + v;
      chip.classList.add("bk", "tap");
    }
    loadNewPage(v);
  }
  (function () {
    const chip = $("appVer");
    if (chip) chip.addEventListener("click", () => { if (newV) loadNewPage(newV); });
  })();
  async function fetchLatest() {
    const res = await fetch(FEED_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return { st: "vide" };
    const nd = await res.json();
    if (!nd || !nd.weeks || !Array.isArray(nd.weeksAvailable) || !nd.updatedAt) return { st: "incomplet" };
    for (const k of nd.weeksAvailable) if (!Array.isArray(nd.weeks[k])) return { st: "incomplet" };
    checkNewPage(nd.appVersion);
    return { st: "ok", data: nd };
  }
  async function updateNow(manual) {
    if (updBusy) return;
    updBusy = true; updBtn.disabled = true; updBtn.classList.add("busy");
    setMsg(manual ? "Mise à jour en cours…" : "Recherche de nouvelles données…");
    try {
      const r = await Promise.race([fetchLatest(), new Promise((_, rej) => setTimeout(() => rej(new Error("délai dépassé")), 20000))]);
      if (r.st === "ok") {
        if (String(r.data.updatedAt) > String(D.updatedAt)) {
          const newWeek = String(r.data.week) !== String(D.week);
          D = r.data;
          if (newWeek) selectedWeek = null;
          render();
          setMsg("✓ Mis à jour", "ok");
        } else {
          setMsg(manual ? "✓ Déjà à jour" : "", "ok");
        }
      } else if (r.st === "na") {
        setMsg(manual ? "Mise à jour impossible ici : ouvre la page par ton lien privé Claude." : "", "err");
      } else {
        setMsg(manual ? "Pas de nouvelles données pour le moment" : "", "err");
      }
    } catch (e) {
      setMsg(manual ? "Mise à jour impossible (connexion ?)" : "", "err");
    } finally {
      updBusy = false; updBtn.disabled = false; updBtn.classList.remove("busy");
    }
  }
  updBtn.addEventListener("click", () => updateNow(true));
  $("liveBtn").addEventListener("click", () => {
    liveOnly = !liveOnly;
    if (liveOnly) selectedWeek = null;
    render();
    window.scrollTo(0, 0);
    if (liveOnly) liveTick(true);
  });
  // --- Scores en direct (ESPN) : superposés aux cartes, les chiffres M3 ne changent pas ---
  var LIVE = {}, liveBusy = false, liveSig = "", livePending = false, liveFails = 0, liveOnly = false;
  function liveOv(g) {
    const L = LIVE && LIVE[g.id];
    if (!L || g.status === "closed") return g;
    if (L.state === "post") return Object.assign({}, g, { status: "closed", homeScore: L.h, awayScore: L.a, _live: "post" });
    if (L.state === "in") return Object.assign({}, g, { homeScore: L.h, awayScore: L.a, _live: "in", _liveTxt: L.txt });
    return g;
  }
  // --- Vue « En direct » : une ligne par match, tout tient sur un seul écran ---
  function liveRow(D2, ctx, g, idx) {
    const p = g.pred, unlocked = ctx.isUnlocked(g), showPct = !!p && unlocked;
    const favHome = p ? p.pHome >= p.pAway : null;
    const bs = isBet(g.id) ? betSide(g) : "";
    const st = String(g._liveTxt || "").replace("Fin du ", "Fin ");
    const sp = st.split(" "), stHtml = sp.length === 2 && /^\d/.test(sp[1]) ? "<b>" + esc(sp[0]) + "</b><i>" + esc(sp[1]) + "</i>" : esc(st);
    const hl = g.homeScore > g.awayScore, al = g.awayScore > g.homeScore;
    const bd = (side) => showPct ? '<span class="pbadge ' + side + ((side === "home" ? favHome === true : favHome === false) ? " fav" : "") + '">' + pct(side === "home" ? p.pHome : p.pAway) + "</span>" : "";
    return '<div class="game lrow clickable' + (bs ? " betted" : "") + '" data-idx="' + idx + '" data-id="' + esc(g.id) + '"><span class="lst">' + stHtml + '</span><span class="lt h' + (bs === "home" ? " pick" : "") + '">' + shield(D2, g.home) + bd("home") + '</span><span class="lsc"><b class="' + (hl ? "lead" : "") + '">' + g.homeScore + "</b><i>\u2013</i><b class=\"" + (al ? "lead" : "") + '">' + g.awayScore + '</b></span><span class="lt a' + (bs === "away" ? " pick" : "") + '">' + bd("away") + shield(D2, g.away) + "</span></div>";
  }
  function liveLabel(st) {
    const n = (st.type && st.type.name) || "";
    if (n === "STATUS_HALFTIME") return "Mi-temps";
    if (n === "STATUS_END_PERIOD") return "Fin du Q" + st.period;
    if (n === "STATUS_DELAYED" || n === "STATUS_RAIN_DELAY" || n === "STATUS_SUSPENDED") return "Interrompu";
    return (st.period > 4 ? "Prol." : "Q" + st.period) + " " + (st.displayClock || "");
  }
  async function fetchLive() {
    const url = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=" + D.week + "&seasontype=2&dates=" + D.season;
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 12000);
    try {
      const res = await fetch(url, { cache: "no-store", signal: ctl.signal });
      if (!res.ok) throw new Error("http " + res.status);
      const j = await res.json();
      const byTeams = {};
      (D.weeks[D.week] || []).forEach((g) => { byTeams[g.home + "|" + g.away] = g.id; });
      const out = {};
      (j.events || []).forEach((e) => {
        const c = (e.competitions || [])[0]; if (!c) return;
        const h = c.competitors.find((x) => x.homeAway === "home"), a = c.competitors.find((x) => x.homeAway === "away");
        const id = h && a && byTeams[h.team.displayName + "|" + a.team.displayName]; if (!id) return;
        const st = e.status || {}, state = st.type && st.type.state;
        if (state === "in" || state === "post") out[id] = { state: state, h: parseInt(h.score, 10) || 0, a: parseInt(a.score, 10) || 0, txt: state === "in" ? liveLabel(st) : "Final" };
      });
      Object.keys(LIVE).forEach((k) => { if (LIVE[k].state === "post" && !out[k]) out[k] = LIVE[k]; });
      return out;
    } finally { clearTimeout(to); }
  }
  function liveWanted() {
    const now = Date.now();
    if (Object.keys(LIVE).some((k) => LIVE[k].state === "in")) return true;
    return (D.weeks[D.week] || []).some((g) => g.status !== "closed" && now >= Date.parse(g.kickoff) - 15 * 60000 && now <= Date.parse(g.kickoff) + 5 * 3600000);
  }
  function modalOpen() { return $("gameModalOverlay").classList.contains("open"); }
  async function liveTick(force) {
    if (liveBusy || document.hidden) return;
    if (livePending && !modalOpen()) { livePending = false; render(); }
    if (!force && !liveWanted()) return;
    liveBusy = true;
    const el = $("liveMsg");
    try {
      const out = await fetchLive();
      liveFails = 0;
      const sig = JSON.stringify(out);
      if (sig !== liveSig) { liveSig = sig; LIVE = out; if (modalOpen()) livePending = true; else render(); }
      const n = Object.keys(out).filter((k) => out[k].state === "in").length;
      const t = new Date().toLocaleTimeString("fr-FR", { timeZone: "Europe/Paris", hour: "2-digit", minute: "2-digit", second: "2-digit" });
      if (n) { el.textContent = "● " + n + " match" + (n > 1 ? "s" : "") + " en direct (ESPN) · actualisé à " + t; el.className = "on"; }
      else { el.textContent = ""; el.className = ""; }
    } catch (e) {
      liveFails++;
      if (liveFails >= 2 || force) { el.textContent = "Scores en direct indisponibles pour le moment (connexion ?)."; el.className = ""; }
    } finally { liveBusy = false; }
  }
  setInterval(() => liveTick(false), 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) liveTick(true); });
  render();
  updateNow(false);
  liveTick(true);
})();

</script>
