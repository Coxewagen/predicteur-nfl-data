<title>Prédicteur NFL 2026</title>
<meta name="theme-color" content="#0d2818">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Même identité que le Prédicteur NFL (page web) : terrain vert nuit en fond, blanc "craie" pour
   le texte, ambre pour les accents/CTA, bleu marine en structure — un seul thème fixe (comme la
   page web elle-même, qui n'a pas de variante claire), pas de bascule clair/sombre ici. */
:root{
  --pitch:#0d2818; --pitch2:#0a2013;
  --surface:rgba(255,255,255,.055); --surface-solid:#15331f;
  --ink:#f2f2f0; --muted:#9fb0a8; --line:rgba(255,255,255,.16); --track:rgba(255,255,255,.1);
  --navy:#1d3a6e; --on-navy:#ffffff; --navy-soft:#b7c6e4;
  --field:#3ddc84; --on-field:#04200f; --field-bg:rgba(61,220,132,.16);
  --bad:#ff6b60; --bad-bg:rgba(255,107,96,.16);
  --warn:#ffb020; --warn-bg:rgba(255,176,32,.16);
  --gold:#ffb020; --gold-bg:rgba(255,176,32,.16);
  --sans:"IBM Plex Sans",Arial,Helvetica,sans-serif; --cond:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--pitch),var(--pitch2));color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.45;margin:0}
svg.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.2em}

.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* --- barre du haut --- */
/* Pas de bandeau bleu plein : ça détonnait avec le vert terrain du reste de l'appli. Le titre
   reste sur le fond vert comme dans la page web d'origine (titre ambre, sous-titre craie), avec
   juste un fin trait de séparation en bas — le bleu marine redevient un simple accent (comme sur
   la page web), pas un bloc de couleur à lui tout seul. */
.topbar{background:transparent;color:var(--ink);display:flex;gap:12px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;border-bottom:1px solid var(--line)}
.topbar .ball{width:40px;height:40px;flex:none}
.topbar .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.eyebrow{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.topbar h1{font-family:var(--cond);font-size:24px;margin:0;font-weight:700;color:var(--gold)}
.refresh{background:rgba(255,255,255,0.1);border:1px solid var(--line);color:var(--ink);
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.refresh:active{background:rgba(255,255,255,0.28)}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.offline-banner{background:var(--warn-bg);color:var(--warn);display:flex;gap:8px;align-items:center;
  font-size:14px;padding:8px 16px;font-weight:600}

/* --- contenu --- */
main{flex:1;padding:16px;padding-bottom:28px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:14px}

h2{font-family:var(--cond);font-size:22px;margin:0;font-weight:700;display:flex;align-items:center;gap:9px}
h2 .sq{width:32px;height:32px;border-radius:9px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;flex:none}
h2 .sq.g{background:var(--field);color:var(--on-field)}
h2 .sq.gold{background:var(--gold);color:#241a02}
h2.week-head #weekTitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week-pager{margin-left:auto;display:flex;gap:6px;flex:none}
.pager-btn{width:30px;height:30px;border-radius:50%;background:var(--track);border:none;color:var(--ink);
  font-size:18px;line-height:1;display:grid;place-items:center;font-family:var(--sans)}
.pager-btn:disabled{opacity:.35}
.meta{color:var(--muted);font-size:15px;margin:0}
.alert{background:var(--warn-bg);border-left:6px solid var(--warn);border-radius:10px;padding:12px 14px;font-size:16px;display:flex;gap:10px}
.alert svg{color:var(--warn);margin-top:3px;flex:none}

.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* --- cartes de match --- */
.games{display:flex;flex-direction:column;gap:10px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;flex-direction:column;gap:9px}
.game.net{border-color:var(--field);box-shadow:inset 5px 0 0 var(--field)}
.ghead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.when{font-weight:600;color:var(--muted);font-size:15px;display:inline-flex;align-items:center;gap:6px}
.tag{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;background:var(--track);color:var(--muted)}
.tag.net{background:var(--field);color:var(--on-field)}
.tag.ok{background:var(--field-bg);color:var(--field)} .tag.ko{background:var(--bad-bg);color:var(--bad)}
.team{display:flex;align-items:center;gap:10px}
.shield{width:36px;height:36px;flex:none}
.tname{font-size:17px;font-weight:500;min-width:0;flex:1;display:flex;align-items:center;gap:6px 7px;flex-wrap:wrap}
.tname.fav{font-weight:700}
.tname .short{display:none}
.role{color:var(--muted);display:inline-flex}
.chip{font-size:13px;font-weight:700;padding:1px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;background:var(--warn-bg);color:var(--warn)}
.chip.qb{background:var(--bad-bg);color:var(--bad)}
.pct{font-family:var(--cond);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct.fav{color:var(--field)}
.split{display:flex;height:11px;border-radius:999px;overflow:hidden;gap:3px;background:var(--surface);outline:1px solid var(--line)}
.split i{display:block;height:100%}
.gfoot{font-size:15px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.gfoot b{color:var(--ink);font-variant-numeric:tabular-nums}
.game.clickable{cursor:pointer}

/* --- verrou abonnement : remplace les probabilités quand non-abonné --- */
.lock-row{display:flex;align-items:center;gap:10px;background:var(--gold-bg);color:var(--gold);
  border-radius:9px;padding:8px 11px;font-size:14.5px;font-weight:600}
.lock-row svg{flex:none}
.lock-row .go{margin-left:auto;background:var(--gold);color:#241a02;border:none;border-radius:999px;
  font-size:13.5px;font-weight:700;padding:5px 12px;white-space:nowrap}
.blur-fig{filter:blur(6px);user-select:none;pointer-events:none}

/* --- bilan --- */
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.fig{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--navy);border-radius:12px;
  padding:11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig.g{border-top-color:var(--field)}
.fig .n{font-family:var(--cond);font-size:32px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.fig .l{font-size:13.5px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px;font-variant-numeric:tabular-nums}
th{font-family:var(--cond);text-align:left;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);border-bottom:2px solid var(--navy);padding:7px 8px 7px 0}
td{border-bottom:1px solid var(--line);padding:8px 8px 8px 0;vertical-align:top}
.yes{color:var(--field);font-weight:700} .no{color:var(--bad);font-weight:700}

/* --- carte "verrou" pleine largeur (bilan complet, détail des absences) --- */
.gate-card{background:var(--surface);border:1px dashed var(--gold);border-radius:12px;padding:18px 16px;
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gate-card svg.big{width:34px;height:34px;color:var(--gold)}
.gate-card b{font-size:16px}
.gate-card p{margin:0;color:var(--muted);font-size:14.5px}
.btn-gold{background:var(--gold);color:#241a02;border:none;border-radius:999px;font-weight:700;
  font-size:15.5px;padding:10px 20px;font-family:var(--sans)}

/* --- écran Abonnement --- */
.pro-hero{background:linear-gradient(160deg,var(--navy),#0a1f3d);color:#fff;border-radius:16px;
  padding:22px 18px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.pro-hero svg{width:40px;height:40px;color:var(--gold)}
.pro-hero h3{margin:2px 0 0;font-family:var(--cond);font-size:23px}
.pro-hero p{margin:0;color:var(--navy-soft);font-size:15px}
.pro-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.pro-list li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.pro-list svg{color:var(--field);flex:none;margin-top:2px}
.plan{background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:14px 16px;
  display:flex;flex-direction:column;gap:4px}
.plan .price{font-family:var(--cond);font-size:26px;font-weight:700}
.plan .sub{color:var(--muted);font-size:14px}
.btn-main{background:var(--gold);color:#241a02;border:none;border-radius:12px;font-weight:700;
  font-size:17px;padding:14px;font-family:var(--sans);width:100%}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}
.pro-active{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:20px 0}
.pro-active svg{width:46px;height:46px;color:var(--field)}
.legal{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.legal a{color:var(--muted)}

/* --- navigation par onglets --- */
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface-solid);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 8px;color:var(--muted);font-size:12.5px;font-family:var(--sans);font-weight:600}
.tab.active{color:var(--gold)}
.tab .ic{width:1.3em;height:1.3em}

/* --- modale fiche de match --- */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;
  align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-panel{position:relative;width:100%;max-width:760px;max-height:85vh;overflow-y:auto;
  background:linear-gradient(160deg,var(--surface-solid),var(--pitch2));border-radius:18px 18px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  box-shadow:0 -10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
.modal-panel .handle{width:40px;height:4px;border-radius:999px;background:var(--line);margin:0 auto}
.modal-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;
  background:var(--track);border:none;color:var(--ink);font-size:16px;line-height:1}

@media (max-width:380px){
  .tname .long{display:none} .tname .short{display:inline}
  .figs{gap:7px} .fig{padding:9px 7px} .fig .n{font-size:27px} .fig .l{font-size:12.5px}
}

/* --- case « J'ai parié » + badge « Validé » (mémorisés sur l'appareil) --- */
.gtags{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.validated{display:none;font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;align-items:center;gap:5px;background:var(--gold);color:#241a02}
.betted .validated{display:inline-flex}
.game.betted{border-color:var(--gold);box-shadow:inset 5px 0 0 var(--gold)}
.bet{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
  padding:6px 0;align-self:flex-start;min-height:44px}
.bet input{position:absolute;opacity:0;width:1px;height:1px}
.bet .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent}
.bet .box svg{width:18px;height:18px;stroke-width:3}
.bet input:checked + .box{background:var(--gold);border-color:var(--gold);color:#241a02}
.bet input:focus-visible + .box{outline:3px solid var(--gold);outline-offset:2px}

/* --- fiche détaillée --- */
.mwhen{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.bigpct{display:flex;align-items:baseline;justify-content:center;gap:14px;font-family:var(--cond);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.bigpct .fav{color:var(--field)}
.dim{color:var(--muted);font-size:15px;font-weight:500;font-family:var(--sans)}
.verdict{margin:0;display:flex;gap:8px;align-items:flex-start;font-size:16px;font-weight:700}
.modal-panel h3{font-family:var(--cond);font-size:19px;margin:4px 0 0}
table.cmp{font-size:16px} table.cmp th:not(:first-child),table.cmp td:not(:first-child){text-align:center}
table.cmp td:first-child{color:var(--muted);font-size:15px}
.absgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.absgrid>div{min-width:0}
ul.abs{margin:4px 0 0;padding-left:18px} ul.abs li{margin:3px 0;font-size:15px}
@media (max-width:420px){.absgrid{grid-template-columns:1fr}}

.site-shell{max-width:760px;margin:0 auto;min-height:100%}
</style>

    }
    const stats = '<table class="cmp"><thead><tr><th></th><th>' + esc(nick(D2, g.home)) + "</th><th>" + esc(nick(D2, g.away)) + "</th></tr></thead><tbody><tr><td>Bilan</td><td>" + esc(fh.rec || "\u2013") + "</td><td>" + esc(fa.rec || "\u2013") + "</td></tr><tr><td>Points marqu\xE9s / match</td><td>" + ((_a = fh.pf) != null ? _a : "\u2013") + "</td><td>" + ((_b = fa.pf) != null ? _b : "\u2013") + "</td></tr><tr><td>Points encaiss\xE9s / match</td><td>" + ((_c = fh.pa) != null ? _c : "\u2013") + "</td><td>" + ((_d = fa.pa) != null ? _d : "\u2013") + "</td></tr><tr><td>3 derniers matchs</td><td>" + formHtml(D2, g.home) + "</td><td>" + formHtml(D2, g.away) + "</td></tr></tbody></table>";
    const abs = unlocked && p ? '<h3>Absences retenues</h3><div class="absgrid"><div><b>' + esc(nick(D2, g.home)) + "</b>" + absBlockHtml(D2, g.home) + "</div><div><b>" + esc(nick(D2, g.away)) + "</b>" + absBlockHtml(D2, g.away) + "</div></div>" : "";
    const notes = [];
    if (g.neutral) notes.push("Match jou\xE9 \xE0 l\u2019\xE9tranger : pas d\u2019avantage du terrain.");
    return '<div class="handle"></div><button class="modal-close" id="modalClose" aria-label="Fermer">\u2715</button><div class="mwhen' + (isBet(g.id) ? " betted" : "") + '" data-id="' + esc(g.id) + '"><span class="when">' + ic("clock") + when(g.kickoff) + "</span>" + validated() + '</div><div class="team">' + shield(D2, g.home) + '<span class="tname"><span class="long">' + esc(g.home) + '</span><span class="role">' + ic("home") + '</span></span></div><div class="team">' + shield(D2, g.away) + '<span class="tname"><span class="long">' + esc(g.away) + '</span><span class="role">' + ic("plane") + "</span></span></div>" + betRow(g) + pred + stats + abs + (notes.length ? '<p class="meta">' + notes.join(" ") + "</p>" : "");
  }
  function wireGames(gamesEl, getGames, open) {
    gamesEl.addEventListener("change", (e) => {
      const i = e.target.closest("input[data-bet]");
      if (i) setBet(i.dataset.bet, i.checked);
    });
    gamesEl.addEventListener("click", (e) => {
      if (e.target.closest(".bet") || e.target.closest("[data-go-pro]")) return;
      const card = e.target.closest(".game");
      if (!card) return;
      const g = getGames()[+card.dataset.idx];
      if (g) open(g);
    });
  }
  function wirePanel(panelEl) {
    panelEl.addEventListener("change", (e) => {
      const i = e.target.closest("input[data-bet]");
      if (i) setBet(i.dataset.bet, i.checked);
    });
  }

  // src/site.js
  var $ = (id) => document.getElementById(id);
  var CTX = { isUnlocked: () => true, lockRow: () => "", gateCard: () => "" };
  var selectedWeek = null;
  var shown = [];
  function closeModal() {
    $("gameModalOverlay").classList.remove("open");
  }
  function openModal(g) {
    $("gameModalPanel").innerHTML = modalHtml(D, CTX, g);
    $("modalClose").addEventListener("click", closeModal);
    $("gameModalOverlay").classList.add("open");
  }
  function render() {
    $("eyebrow").textContent = "Saison " + D.season + " \xB7 Semaine " + D.week;
    const ws = weekState(D, selectedWeek);
    selectedWeek = ws.w;
    shown = ws.games;
    $("weekTitle").textContent = ws.title;
    $("updatedMeta").textContent = "Mis \xE0 jour le " + D.updatedLabel + " (heure de Paris)" + (ws.future ? " \xB7 pr\xE9visions provisoires" : "");
    $("weekPrev").disabled = selectedWeek <= ws.minWeek;
    $("weekNext").disabled = selectedWeek >= ws.maxWeek;
    $("games").innerHTML = shown.length ? shown.map((g, i) => gameCard(D, CTX, g, i)).join("") : '<p class="meta">Aucun match enregistr\xE9 pour cette semaine.</p>';
  }
  $("weekPrev").addEventListener("click", () => {
    if (!$("weekPrev").disabled) {
      selectedWeek--;
      render();
    }
  });
  $("weekNext").addEventListener("click", () => {
    if (!$("weekNext").disabled) {
      selectedWeek++;
      render();
    }
  });
  wireGames($("games"), () => shown, openModal);
  wirePanel($("gameModalPanel"));
  $("gameModalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "gameModalOverlay") closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });
  render();
})();

</script>
