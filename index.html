<title>Prédicteur NFL 2026</title>
<meta name="theme-color" content="#0d2818">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Même identité que le Prédicteur NFL (page web) : terrain vert nuit en fond, blanc "craie" pour
   le texte, ambre pour les accents/CTA, bleu marine en structure — un seul thème fixe (comme la
   page web elle-même, qui n'a pas de variante claire), pas de bascule clair/sombre ici. */
:root{
  --pitch:#0d2818; --pitch2:#0a2013;
  --surface:rgba(255,255,255,.055); --surface-solid:#15331f;
  --ink:#f2f2f0; --muted:#9fb0a8; --line:rgba(255,255,255,.16); --track:rgba(255,255,255,.1);
  --navy:#1d3a6e; --on-navy:#ffffff; --navy-soft:#b7c6e4;
  --field:#3ddc84; --on-field:#04200f; --field-bg:rgba(61,220,132,.16);
  --bad:#ff6b60; --bad-bg:rgba(255,107,96,.16);
  --warn:#ffb020; --warn-bg:rgba(255,176,32,.16);
  --gold:#ffb020; --gold-bg:rgba(255,176,32,.16);
  --sans:"IBM Plex Sans",Arial,Helvetica,sans-serif; --cond:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--pitch),var(--pitch2));color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.45;margin:0}
svg.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.2em}

.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* --- barre du haut --- */
/* Pas de bandeau bleu plein : ça détonnait avec le vert terrain du reste de l'appli. Le titre
   reste sur le fond vert comme dans la page web d'origine (titre ambre, sous-titre craie), avec
   juste un fin trait de séparation en bas — le bleu marine redevient un simple accent (comme sur
   la page web), pas un bloc de couleur à lui tout seul. */
.topbar{background:transparent;color:var(--ink);display:flex;gap:12px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;border-bottom:1px solid var(--line)}
.topbar .ball{width:40px;height:40px;flex:none}
.topbar .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.eyebrow{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.topbar h1{font-family:var(--cond);font-size:24px;margin:0;font-weight:700;color:var(--gold)}
.refresh{background:rgba(255,255,255,0.1);border:1px solid var(--line);color:var(--ink);
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.refresh:active{background:rgba(255,255,255,0.28)}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.offline-banner{background:var(--warn-bg);color:var(--warn);display:flex;gap:8px;align-items:center;
  font-size:14px;padding:8px 16px;font-weight:600}

/* --- contenu --- */
main{flex:1;padding:16px;padding-bottom:28px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:14px}

h2{font-family:var(--cond);font-size:22px;margin:0;font-weight:700;display:flex;align-items:center;gap:9px}
h2 .sq{width:32px;height:32px;border-radius:9px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;flex:none}
h2 .sq.g{background:var(--field);color:var(--on-field)}
h2 .sq.gold{background:var(--gold);color:#241a02}
h2.week-head #weekTitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week-pager{margin-left:auto;display:flex;gap:6px;flex:none}
.pager-btn{width:30px;height:30px;border-radius:50%;background:var(--track);border:none;color:var(--ink);
  font-size:18px;line-height:1;display:grid;place-items:center;font-family:var(--sans)}
.pager-btn:disabled{opacity:.35}
.meta{color:var(--muted);font-size:15px;margin:0}
.alert{background:var(--warn-bg);border-left:6px solid var(--warn);border-radius:10px;padding:12px 14px;font-size:16px;display:flex;gap:10px}
.alert svg{color:var(--warn);margin-top:3px;flex:none}

.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* --- cartes de match --- */
.games{display:flex;flex-direction:column;gap:10px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;flex-direction:column;gap:9px}
.game.net{border-color:var(--field);box-shadow:inset 5px 0 0 var(--field)}
.ghead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.when{font-weight:600;color:var(--muted);font-size:15px;display:inline-flex;align-items:center;gap:6px}
.tag{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;background:var(--track);color:var(--muted)}
.tag.net{background:var(--field);color:var(--on-field)}
.tag.ok{background:var(--field-bg);color:var(--field)} .tag.ko{background:var(--bad-bg);color:var(--bad)}
.team{display:flex;align-items:center;gap:10px}
.shield{width:36px;height:36px;flex:none}
.tname{font-size:17px;font-weight:500;min-width:0;flex:1;display:flex;align-items:center;gap:6px 7px;flex-wrap:wrap}
.tname.fav{font-weight:700}
.tname .short{display:none}
.role{color:var(--muted);display:inline-flex}
.chip{font-size:13px;font-weight:700;padding:1px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;background:var(--warn-bg);color:var(--warn)}
.chip.qb{background:var(--bad-bg);color:var(--bad)}
.pct{font-family:var(--cond);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct.fav{color:var(--field)}
.split{display:flex;height:11px;border-radius:999px;overflow:hidden;gap:3px;background:var(--surface);outline:1px solid var(--line)}
.split i{display:block;height:100%}
.gfoot{font-size:15px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.gfoot b{color:var(--ink);font-variant-numeric:tabular-nums}
.game.clickable{cursor:pointer}

/* --- verrou abonnement : remplace les probabilités quand non-abonné --- */
.lock-row{display:flex;align-items:center;gap:10px;background:var(--gold-bg);color:var(--gold);
  border-radius:9px;padding:8px 11px;font-size:14.5px;font-weight:600}
.lock-row svg{flex:none}
.lock-row .go{margin-left:auto;background:var(--gold);color:#241a02;border:none;border-radius:999px;
  font-size:13.5px;font-weight:700;padding:5px 12px;white-space:nowrap}
.blur-fig{filter:blur(6px);user-select:none;pointer-events:none}

/* --- bilan --- */
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.fig{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--navy);border-radius:12px;
  padding:11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig.g{border-top-color:var(--field)}
.fig .n{font-family:var(--cond);font-size:32px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.fig .l{font-size:13.5px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px;font-variant-numeric:tabular-nums}
th{font-family:var(--cond);text-align:left;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);border-bottom:2px solid var(--navy);padding:7px 8px 7px 0}
td{border-bottom:1px solid var(--line);padding:8px 8px 8px 0;vertical-align:top}
.yes{color:var(--field);font-weight:700} .no{color:var(--bad);font-weight:700}

/* --- carte "verrou" pleine largeur (bilan complet, détail des absences) --- */
.gate-card{background:var(--surface);border:1px dashed var(--gold);border-radius:12px;padding:18px 16px;
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gate-card svg.big{width:34px;height:34px;color:var(--gold)}
.gate-card b{font-size:16px}
.gate-card p{margin:0;color:var(--muted);font-size:14.5px}
.btn-gold{background:var(--gold);color:#241a02;border:none;border-radius:999px;font-weight:700;
  font-size:15.5px;padding:10px 20px;font-family:var(--sans)}

/* --- écran Abonnement --- */
.pro-hero{background:linear-gradient(160deg,var(--navy),#0a1f3d);color:#fff;border-radius:16px;
  padding:22px 18px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.pro-hero svg{width:40px;height:40px;color:var(--gold)}
.pro-hero h3{margin:2px 0 0;font-family:var(--cond);font-size:23px}
.pro-hero p{margin:0;color:var(--navy-soft);font-size:15px}
.pro-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.pro-list li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.pro-list svg{color:var(--field);flex:none;margin-top:2px}
.plan{background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:14px 16px;
  display:flex;flex-direction:column;gap:4px}
.plan .price{font-family:var(--cond);font-size:26px;font-weight:700}
.plan .sub{color:var(--muted);font-size:14px}
.btn-main{background:var(--gold);color:#241a02;border:none;border-radius:12px;font-weight:700;
  font-size:17px;padding:14px;font-family:var(--sans);width:100%}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}
.pro-active{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:20px 0}
.pro-active svg{width:46px;height:46px;color:var(--field)}
.legal{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.legal a{color:var(--muted)}

/* --- navigation par onglets --- */
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface-solid);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 8px;color:var(--muted);font-size:12.5px;font-family:var(--sans);font-weight:600}
.tab.active{color:var(--gold)}
.tab .ic{width:1.3em;height:1.3em}

/* --- modale fiche de match --- */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;
  align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-panel{position:relative;width:100%;max-width:760px;max-height:85vh;overflow-y:auto;
  background:linear-gradient(160deg,var(--surface-solid),var(--pitch2));border-radius:18px 18px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  box-shadow:0 -10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
.modal-panel .handle{width:40px;height:4px;border-radius:999px;background:var(--line);margin:0 auto}
/* bouton de fermeture flottant : reste visible en haut à droite pendant qu'on fait défiler la fiche */
.modal-close{position:sticky;top:8px;align-self:flex-end;z-index:5;flex:none;width:46px;height:46px;margin-bottom:-60px;
  border-radius:50%;background:var(--ink);color:var(--pitch);border:2px solid var(--pitch);
  font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.55);cursor:pointer}

@media (max-width:380px){
  .tname .long{display:none} .tname .short{display:inline}
  .figs{gap:7px} .fig{padding:9px 7px} .fig .n{font-size:27px} .fig .l{font-size:12.5px}
}

/* --- case « J'ai parié » + badge « Validé » (mémorisés sur l'appareil) --- */
.gtags{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.validated{display:none;font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;align-items:center;gap:5px;background:var(--gold);color:#241a02}
.betted .validated{display:inline-flex}
.game.betted{border-color:var(--gold);box-shadow:inset 5px 0 0 var(--gold)}
.bet{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
  padding:6px 0;align-self:flex-start;min-height:44px}
.bet input{position:absolute;opacity:0;width:1px;height:1px}
.bet .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent}
.bet .box svg{width:18px;height:18px;stroke-width:3}
.bet input:checked + .box{background:var(--gold);border-color:var(--gold);color:#241a02}
.bet input:focus-visible + .box{outline:3px solid var(--gold);outline-offset:2px}

/* --- fiche détaillée --- */
.mwhen{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.dim{color:var(--muted);font-size:15px;font-weight:500;font-family:var(--sans)}
.verdict{margin:0;display:flex;gap:8px;align-items:flex-start;font-size:16px;font-weight:700}
.modal-panel h3{font-family:var(--cond);font-size:19px;margin:4px 0 0}
table.cmp{font-size:16px} table.cmp th:not(:first-child),table.cmp td:not(:first-child){text-align:center}
table.cmp td:first-child{color:var(--muted);font-size:15px}
.absgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.absgrid>div{min-width:0}
ul.abs{margin:4px 0 0;padding-left:18px} ul.abs li{margin:3px 0;font-size:15px}
@media (max-width:420px){.absgrid{grid-template-columns:1fr}}

/* --- pastilles de pourcentage (mêmes couleurs que le prédicteur : bleu = domicile, rouge = extérieur) --- */
.pright{display:flex;align-items:center;gap:10px;flex:none}
.pbadge{font-family:Consolas,"Courier New",monospace;font-weight:800;font-size:22px;color:#fff;border-radius:8px;
  padding:6px 11px;min-width:76px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.pbadge.home{background:#1d3a6e} .pbadge.away{background:#7a1f1f}
.pbadge.fav{box-shadow:0 0 0 3px var(--gold)}
.pbadge.big{font-size:34px;padding:10px 18px;min-width:118px}
.pbadge.big i{display:block;font-style:normal;font-family:var(--sans);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.9;margin-bottom:2px}
.bigbadges{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.pright .pct{min-width:2ch;text-align:right}
@media (max-width:460px){.pbadge{font-size:19px;min-width:64px;padding:5px 7px}.pright{gap:7px}.pbadge.big{font-size:30px;min-width:104px;padding:9px 14px}}

/* Un élément avec l'attribut hidden doit vraiment disparaître, même si sa classe lui donne un display (bandeau hors-ligne, etc.). */
[hidden]{display:none !important;}

/* Marché et avertissements (contredit / prudence) */
.tag.warn-ko{background:var(--bad);color:#2a0805}
.tag.warn-pru{background:var(--warn);color:#241a02}
.mktbox{margin-top:10px;font-size:16px;color:var(--ink)}
.warnbox{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;padding:10px 12px;border-radius:10px;font-size:16px;line-height:1.35}
.warnbox svg{flex:none;margin-top:3px}
.warnbox.ko{background:var(--bad-bg);border-left:6px solid var(--bad);color:var(--ink)}
.warnbox.pru{background:var(--warn-bg);border-left:6px solid var(--warn);color:var(--ink)}

/* fraîcheur des blessures (10/10) */
.inj{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.inj.ok{color:var(--field)}
.inj.prov{color:var(--warn)}
.injbox{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;padding:10px 12px;border-radius:10px;font-size:16px;line-height:1.35;color:var(--ink)}
.injbox svg{flex:none;margin-top:3px}
.injbox.ok{background:var(--field-bg);border-left:6px solid var(--field)}
.injbox.prov{background:var(--warn-bg);border-left:6px solid var(--warn)}

/* scores en direct (10/10) */
.tag.live{background:var(--bad);color:#fff;display:inline-flex;align-items:center;gap:6px}
.tag.live .dot,.livebox .dot{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block;animation:livepulse 1.2s ease-in-out infinite}
.livebox .dot{background:var(--bad);margin-right:6px}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.25}}
.pct.livesc{color:var(--ink)}
.livebox{margin:6px 0 10px;padding:10px 12px;border-radius:10px;background:var(--bad-bg);border-left:6px solid var(--bad);font-size:17px}
.dim{color:var(--muted);font-weight:400}

/* filtre « Favoris 65 % et plus » (12/10) */
.filterbar{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.filterbar button{flex:1 1 auto;min-height:46px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 17px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.filterbar button.on{background:var(--field);border-color:var(--field);color:var(--on-field)}
.favhead{font-size:17px;margin:0 0 12px;color:var(--ink)}
.favhead b{color:var(--field)}

/* titulaires à surveiller (12/10) */
.chip.watch{background:rgba(120,170,255,.18);color:#9cc3ff}
.abs li.watch{color:#9cc3ff}
.prevrep{color:var(--warn);font-weight:700}

/* victoire surprise (12/10) */
.surprise{color:var(--gold);font-size:18px;cursor:help}

/* --- analyse des matchs serrés (mercredi / samedi) --- */
.tag.ana{background:var(--navy);color:var(--on-navy)}
.anabox{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:rgba(29,58,110,.35);border-left:6px solid var(--navy-soft);color:var(--ink);font-size:17px;line-height:1.45}
.anabox h3{margin:0 0 6px;font-size:18px}
.anabox p{margin:6px 0}
.anabox ul{margin:6px 0;padding-left:20px}
.anabox li{margin:3px 0}
.anabox .anavis{background:rgba(255,255,255,.07);border-radius:8px;padding:8px 10px}
.anabox .meta{font-size:14px}

.site-shell{max-width:760px;margin:0 auto;min-height:100%}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>

  <symbol id="i-cross" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></symbol>

</svg>

<div class="app">
  <header class="topbar">
    <svg class="ball" viewBox="0 0 54 54" aria-hidden="true">
      <ellipse cx="27" cy="27" rx="24" ry="14.5" transform="rotate(-35 27 27)" fill="#8A4B22" stroke="#FFFFFF" stroke-width="2.5"/>
      <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" transform="rotate(-35 27 27)"><path d="M17 27h20M21 23v8M27 23v8M33 23v8"/></g>
    </svg>
    <div class="txt">
      <span class="eyebrow" id="eyebrow">Saison —</span>
      <h1>Prédicteur NFL</h1>
    </div>
  </header>
  <main id="views">
    <section class="view" id="view-week">
      <h2 class="week-head">
        <span class="sq"><svg class="ic"><use href="#i-cal"/></svg></span>
        <span id="weekTitle">Cette semaine</span>
        <span class="week-pager">
          <button type="button" id="weekPrev" class="pager-btn" aria-label="Semaine précédente">‹</button>
          <button type="button" id="weekNext" class="pager-btn" aria-label="Semaine suivante">›</button>

      return '<div class="team">' + shield(D2, name) + '<span class="tname' + (fav ? " fav" : "") + '"><span class="long">' + esc(name) + '</span><span class="short">' + esc(nick(D2, name)) + '</span><span class="role" title="' + (side === "home" ? "\xC0 domicile" : "\xC0 l\u2019ext\xE9rieur") + '">' + ic(side === "home" ? "home" : "plane") + "</span>" + chips(g.abs[side]) + '</span><span class="pright">' + right + "</span></div>";
    };
    const foot = [];
    if (done) foot.push("R\xE9sultat : <b>" + hsc + " \u2013 " + asc + "</b>" + (g.status !== "closed" ? ' <span class="dim">(provisoire, ESPN)</span>' : ""));
    if (p && unlocked) foot.push("Score attendu : <b>" + p.expHome + " \u2013 " + p.expAway + "</b>");
    if (mk) foot.push("March\xE9 : <b>" + esc(nick(D2, mk.favMkt)) + " " + pct(mk.pMkt) + "</b>");
    if (!p && !done) foot.push("Pr\xE9vision indisponible (pas encore assez de matchs jou\xE9s)");
    const inj = injState(g);
    if (inj && p && unlocked) foot.push(inj === "final" ? '<span class="inj ok" title="Rapport final de blessures publi\xE9 pour les deux \xE9quipes">' + ic("check") + "Blessures \xE0 jour</span>" : '<span class="inj prov" title="Rapport final pas encore publi\xE9 (vendredi pour un match du dimanche, mercredi pour le jeudi) : le mod\xE8le utilise le rapport pr\xE9c\xE9dent">' + ic("clock") + "Blessures provisoires</span>");
    const lock = p && !unlocked ? ctx.lockRow(g) : "";
    return '<div class="game' + (net && !done ? " net" : "") + (isBet(g.id) ? " betted" : "") + ' clickable" data-idx="' + idx + '" data-id="' + esc(g.id) + '"><div class="ghead"><span class="when">' + ic("clock") + when(g.kickoff) + '</span><span class="gtags">' + validated() + tag + "</span></div>" + line("home") + line("away") + lock + (foot.length ? '<div class="gfoot">' + foot.map((f) => "<span>" + f + "</span>").join("") + "</div>" : "") + betRow(g) + "</div>";
  }
  function injState(g) {
    if (!g.blessures || g.status === "closed") return null;
    const k = g.kickoff ? Date.parse(g.kickoff) : NaN;
    if (!isNaN(k) && k <= Date.now()) return null;
    return g.blessures === "final" ? "final" : "provisoire";
  }
  function marketModal(D2, g) {
    const mk = marketInfo(g);
    if (!mk) return "";
    const ln = fmtLine(D2, g);
    let html = '<div class="mktbox"><b>March\xE9</b> : ' + esc(nick(D2, g.home)) + " " + pct(mk.mkPH) + " \xB7 " + esc(nick(D2, g.away)) + " " + pct(1 - mk.mkPH) + (ln ? " \xB7 ligne " + esc(ln) : "") + "</div>";
    if (mk.level === "contredit")
      html += '<p class="warnbox ko">' + ic("warn") + "<span><b>Le mod\xE8le contredit le march\xE9.</b> Il voit " + esc(nick(D2, mk.favMod)) + " gagner, le march\xE9 pr\xE9f\xE8re " + esc(nick(D2, mk.favMkt)) + " (" + Math.round(Math.abs(mk.gap)) + " pts d\u2019\xE9cart). Sur 2020-2026, dans ce cas, le mod\xE8le a eu raison 34 % du temps et le march\xE9 66 %. Fais plut\xF4t confiance au march\xE9 : le \xAB pari rentable \xBB apparent est probablement une illusion.</span></p>";
    else if (mk.level === "prudence")
      html += '<p class="warnbox pru">' + ic("warn") + "<span><b>Prudence.</b> Le mod\xE8le donne " + pct(mk.pFav) + " \xE0 " + esc(nick(D2, mk.favMod)) + ", le march\xE9 " + pct(mk.mFav) + ". Sur 2020-2026, ces favoris ont gagn\xE9 environ 75 % du temps, contre environ 82 % quand mod\xE8le et march\xE9 sont d\u2019accord.</span></p>";
    return html;
  }
  function analyseDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("fr-FR", { ...PARIS, weekday: "long", day: "numeric", month: "long" }) + " \xE0 " + d.toLocaleTimeString("fr-FR", { ...PARIS, hour: "2-digit", minute: "2-digit" }).replace(":", " h ");
  }
  function analyseHtml(D2, g) {
    const a = g.analyse;
    if (!a || !a.resume && !(a.points || []).length && !a.avis) return "";
    const r = a.raisons || [];
    const why = [r.includes("serr\xE9") ? "match serr\xE9" : "", r.includes("d\xE9saccord") ? "mod\xE8le et march\xE9 en d\xE9saccord" : ""].filter(Boolean).join(" \xB7 ");
    const conf = a.confiance === "moyenne" ? "moyenne" : "faible";
    return '<div class="anabox"><h3>Analyse du match' + (why ? ' <span class="dim">(' + esc(why) + ")</span>" : "") + "</h3>" + (a.resume ? "<p>" + esc(a.resume) + "</p>" : "") + ((a.points || []).length ? "<ul>" + a.points.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "") + (a.avis ? '<p class="anavis"><b>Avis' + (a.penchant ? " \u2014 penchant " + esc(nick(D2, a.penchant)) : "") + "</b> (confiance " + conf + ") : " + esc(a.avis) + "</p>" : "") + '<p class="meta">Analyse automatique' + (a.faitLe ? " du " + esc(analyseDate(a.faitLe)) : "") + ". Ce n\u2019est pas une certitude : sur un match serr\xE9, une petite mise ou pas de mise du tout.</p></div>";
  }
  function absBlockHtml(D2, name) {
    const items = ((D2.absences || []).find((a) => a.team === name) || { items: [] }).items;
    if (!items.length) return '<p class="meta">Aucune absence notable retenue.</p>';
    return '<ul class="abs">' + items.map((i) => "<li" + (i.watch ? ' class="watch"' : "") + ">" + esc(i.side) + " : " + esc(i.txt).replace(", rapport pr\xE9c\xE9dent", ', <span class="prevrep">rapport de la semaine pass\xE9e</span>') + "</li>").join("") + "</ul>";
  }
  var formHtml = (D2, t) => {
    const f = (D2.fiche || {})[t];
    if (!f || !f.form || !f.form.length) return "\u2013";
    return f.form.map((x) => '<span class="' + (x.r === "V" ? "yes" : x.r === "D" ? "no" : "") + '"><b>' + x.r + "</b></span> " + esc(x.s) + ' <span class="dim">vs ' + esc((D2.teams[x.opp] || {}).abbr || "?") + "</span>" + (x.sup != null ? ' <span class="surprise" title="Victoire surprise : le mod\xE8le ne lui donnait que ' + x.sup + ' %">\u26A1</span>' : "")).join("<br>");
  };
  function modalHtml(D2, ctx, g) {
    var _a, _b, _c, _d;
    const p = g.pred, done = g.status === "closed";
    const unlocked = ctx.isUnlocked(g);
    const fh = (D2.fiche || {})[g.home] || {}, fa = (D2.fiche || {})[g.away] || {};
    let pred;
    if (unlocked && p) {
      const favHome = p.pHome >= p.pAway, ecart = Math.abs(p.expHome - p.expAway);
      const verdict = done && g.homeScore !== g.awayScore ? '<p class="verdict ' + (g.homeScore > g.awayScore === favHome ? "yes" : "no") + '">' + ic(g.homeScore > g.awayScore === favHome ? "check" : "x") + (g.homeScore > g.awayScore === favHome ? "Pr\xE9vision juste" : "Pr\xE9vision fausse") + " \u2014 r\xE9sultat " + g.homeScore + " \u2013 " + g.awayScore + " (pr\xE9vu " + p.expHome + " \u2013 " + p.expAway + ")</p>" : "";
      pred = '<div class="bigbadges"><span class="pbadge big home' + (favHome ? " fav" : "") + '"><i>Domicile</i>' + pct(p.pHome) + '</span><span class="pbadge big away' + (!favHome ? " fav" : "") + '"><i>Ext\xE9rieur</i>' + pct(p.pAway) + '</span></div><div class="gfoot"><span>Score attendu : <b>' + p.expHome + " \u2013 " + p.expAway + "</b></span><span>\xC9cart attendu : <b>" + (ecart ? esc(nick(D2, favHome ? g.home : g.away)) + " de " + ecart + " pt" + (ecart > 1 ? "s" : "") : "aucun") + "</b></span></div>" + verdict + marketModal(D2, g) + (injState(g) === "final" ? '<p class="injbox ok">' + ic("check") + "<span><b>Blessures \xE0 jour.</b> Le rapport final de la NFL est publi\xE9 pour les deux \xE9quipes : la pr\xE9vision tient compte des absences officielles.</span></p>" : "") + (g.prov ? '<p class="meta">Pr\xE9vision provisoire : recalcul\xE9e \xE0 chaque mise \xE0 jour avec les stats et les absences du moment.</p>' : "") + analyseHtml(D2, g);
    } else if (p) {
      pred = ctx.gateCard();
    } else {
      pred = '<p class="meta">Pas assez de matchs jou\xE9s pour g\xE9n\xE9rer une pr\xE9vision.</p>';
    }
    const stats = '<table class="cmp"><thead><tr><th></th><th>' + esc(nick(D2, g.home)) + "</th><th>" + esc(nick(D2, g.away)) + "</th></tr></thead><tbody><tr><td>Bilan</td><td>" + esc(fh.rec || "\u2013") + "</td><td>" + esc(fa.rec || "\u2013") + "</td></tr><tr><td>Points marqu\xE9s / match</td><td>" + ((_a = fh.pf) != null ? _a : "\u2013") + "</td><td>" + ((_b = fa.pf) != null ? _b : "\u2013") + "</td></tr><tr><td>Points encaiss\xE9s / match</td><td>" + ((_c = fh.pa) != null ? _c : "\u2013") + "</td><td>" + ((_d = fa.pa) != null ? _d : "\u2013") + '</td></tr><tr><td>5 derniers matchs <span class="dim">(\u26A1 victoire surprise)</span></td><td>' + formHtml(D2, g.home) + "</td><td>" + formHtml(D2, g.away) + "</td></tr></tbody></table>";
    const abs = unlocked && p ? '<h3>Absences retenues</h3><div class="absgrid"><div><b>' + esc(nick(D2, g.home)) + "</b>" + absBlockHtml(D2, g.home) + "</div><div><b>" + esc(nick(D2, g.away)) + "</b>" + absBlockHtml(D2, g.away) + "</div></div>" : "";
    const notes = [];
    if (g.neutral) notes.push("Match jou\xE9 \xE0 l\u2019\xE9tranger : pas d\u2019avantage du terrain.");
    const lv = liveOf(g);
    const liveLine = lv ? '<p class="livebox">' + (lv.state === "in" ? '<i class="dot"></i><b>En direct</b> \xB7 ' + esc(lv.detail) : "<b>Termin\xE9</b> (score ESPN, le bilan sera valid\xE9 \xE0 la prochaine mise \xE0 jour)") + " \u2014 " + esc(nick(D2, g.home)) + " <b>" + lv.hs + "</b> \u2013 <b>" + lv.as + "</b> " + esc(nick(D2, g.away)) + "</p>" : "";
    return '<button class="modal-close" id="modalClose" aria-label="Fermer">\u2715</button><div class="handle"></div>' + liveLine + '<div class="mwhen' + (isBet(g.id) ? " betted" : "") + '" data-id="' + esc(g.id) + '"><span class="when">' + ic("clock") + when(g.kickoff) + "</span>" + validated() + '</div><div class="team">' + shield(D2, g.home) + '<span class="tname"><span class="long">' + esc(g.home) + '</span><span class="role">' + ic("home") + '</span></span></div><div class="team">' + shield(D2, g.away) + '<span class="tname"><span class="long">' + esc(g.away) + '</span><span class="role">' + ic("plane") + "</span></span></div>" + betRow(g) + pred + stats + abs + (notes.length ? '<p class="meta">' + notes.join(" ") + "</p>" : "");
  }
  function wireGames(gamesEl, getGames, open) {
    gamesEl.addEventListener("change", (e) => {
      const i = e.target.closest("input[data-bet]");
      if (i) setBet(i.dataset.bet, i.checked);
    });
    gamesEl.addEventListener("click", (e) => {
      if (e.target.closest(".bet") || e.target.closest("[data-go-pro]")) return;
      const card = e.target.closest(".game");
      if (!card) return;
      const g = getGames()[+card.dataset.idx];
      if (g) open(g);
    });
  }
  function wirePanel(panelEl) {
    panelEl.addEventListener("change", (e) => {
      const i = e.target.closest("input[data-bet]");
      if (i) setBet(i.dataset.bet, i.checked);
    });
  }

  // src/site.js
  var $ = (id) => document.getElementById(id);
  var CTX = { isUnlocked: () => true, lockRow: () => "", gateCard: () => "" };
  var selectedWeek = null;
  var shown = [];
  function closeModal() {
    $("gameModalOverlay").classList.remove("open");
  }
  function openModal(g) {
    $("gameModalPanel").innerHTML = modalHtml(D, CTX, g);
    $("modalClose").addEventListener("click", closeModal);
    $("gameModalOverlay").classList.add("open");
  }
  function render() {
    $("eyebrow").textContent = "Saison " + D.season + " \xB7 Semaine " + D.week;
    const ws = weekState(D, selectedWeek);
    selectedWeek = ws.w;
    shown = ws.games;
    $("weekTitle").textContent = ws.title;
    $("updatedMeta").textContent = "Mis \xE0 jour le " + D.updatedLabel + " (heure de Paris)" + (ws.future ? " \xB7 pr\xE9visions provisoires" : "");
    $("weekPrev").disabled = selectedWeek <= ws.minWeek;
    $("weekNext").disabled = selectedWeek >= ws.maxWeek;
    const mode = currentFilter(), fav = favGames(CTX, shown);
    filterBar($("games"), render).innerHTML = filterBarHtml(mode, fav.length);
    if (mode === "fav") shown = fav;
    $("games").innerHTML = (mode === "fav" ? favHeaderHtml(D, fav.length) : "") + (shown.length ? shown.map((g, i) => gameCard(D, CTX, g, i)).join("") : mode === "fav" ? "" : '<p class="meta">Aucun match enregistr\xE9 pour cette semaine.</p>');
  }
  $("weekPrev").addEventListener("click", () => {
    if (!$("weekPrev").disabled) {
      selectedWeek--;
      render();
    }
  });
  $("weekNext").addEventListener("click", () => {
    if (!$("weekNext").disabled) {
      selectedWeek++;
      render();
    }
  });
  wireGames($("games"), () => shown, openModal);
  wirePanel($("gameModalPanel"));
  $("gameModalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "gameModalOverlay") closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });
  render();
  startLive(() => D, render);
})();

</script>
